const YEARS = Object.keys(DATA);

function fmt(n) {
  return n.toLocaleString(undefined, {minimumFractionDigits:3, maximumFractionDigits:3});
}

// Header

const tbody = document.getElementById("tbody");

let headHtml = "<tr><th>Month</th>";

headHtml += "</tr>";
thead.innerHTML = headHtml;

// Month rows
let bodyHtml = "";
MONTHS.forEach(m => {
  bodyHtml += `<tr><td>${m}</td>`;
  YEARS.forEach(y => {
    const v = DATA[y][m];
    bodyHtml += v === undefined
      ? `<td class="dash">—</td>`
      : `<td>${fmt(v)}</td>`;
  });
  bodyHtml += "</tr>";
});

// Total row
bodyHtml += `<tr class="total"><td>Annual total</td>`;
YEARS.forEach(y => {
  const vals = Object.values(DATA[y]);
  const sum = vals.reduce((a,b) => a+b, 0);
  const incomplete = vals.length < 12;
  bodyHtml += `<td>${fmt(sum)}${incomplete ? " *" : ""}</td>`;
});
bodyHtml += "</tr>";

tbody.innerHTML = bodyHtml;
