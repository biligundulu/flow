<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biligundulu Flow Data · TMC</title>
<style>
  :root {
    --deep: #0a2a43;
    --mid: #0e4a7b;
    --bright: #1a7fc1;
    --sky: #3fb0e8;
    --pale: #d6ecfa;
    --foam: #f0f8ff;
    --sand: #e8f4fc;
    --ink: #0b1e2d;
    --muted: #4a6a82;
    --total: #fff3d6;
    --total-border: #d4a017;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, #bde3fa 0%, transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, #cfe9fb 0%, transparent 55%),
      linear-gradient(180deg, #eaf6ff 0%, #f8fcff 40%, #ffffff 100%);
    min-height: 100vh;
  }

  /* ===== Header ===== */
  header {
    background: linear-gradient(135deg, var(--deep) 0%, var(--mid) 55%, var(--bright) 100%);
    color: #fff;
    padding: 2.5rem 1.5rem 3rem;
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 60px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 60' preserveAspectRatio='none'><path fill='%23eaf6ff' d='M0,30 C240,60 480,0 720,30 C960,60 1200,0 1440,30 L1440,60 L0,60 Z'/></svg>") center/cover no-repeat;
  }
  header .wrap { max-width: 1280px; margin: 0 auto; position: relative; z-index: 1; }
  header h1 {
    margin: 0 0 .4rem;
    font-size: clamp(1.5rem, 3vw, 2.2rem);
    font-weight: 700;
    letter-spacing: -.01em;
  }
  header p {
    margin: 0;
    opacity: .85;
    font-size: .95rem;
  }
  .badge {
    display: inline-block;
    margin-top: .8rem;
    padding: .3rem .7rem;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px;
    font-size: .8rem;
    letter-spacing: .02em;
  }

  /* ===== Layout ===== */
  main {
    max-width: 1280px;
    margin: -1.5rem auto 3rem;
    padding: 0 1rem;
    position: relative;
    z-index: 2;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow:
      0 1px 2px rgba(10,42,67,.06),
      0 8px 24px rgba(10,42,67,.08);
    padding: 1.25rem 1.25rem 1rem;
    margin-bottom: 1.5rem;
  }

  /* ===== Controls ===== */
  .controls {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .controls label {
    font-weight: 600;
    font-size: .95rem;
    color: var(--mid);
  }
  select {
    appearance: none;
    font-size: 1rem;
    padding: .55rem 2.2rem .55rem .8rem;
    border: 1.5px solid var(--pale);
    border-radius: 8px;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%230e4a7b' d='M6 8L0 0h12z'/></svg>") no-repeat right .8rem center,
      var(--foam);
    color: var(--ink);
    cursor: pointer;
    transition: border-color .15s, background-color .15s;
  }
  select:hover { border-color: var(--sky); }
  select:focus { outline: none; border-color: var(--bright); box-shadow: 0 0 0 3px rgba(63,176,232,.25); }

  /* ===== Table ===== */
  .table-wrap {
    overflow-x: auto;
    border-radius: 10px;
    border: 1px solid var(--pale);
    background: #fff;
  }
  table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    min-width: 700px;
    font-variant-numeric: tabular-nums;
  }
  thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: linear-gradient(180deg, var(--mid) 0%, var(--deep) 100%);
    color: #eaf6ff;
    font-weight: 600;
    font-size: .85rem;
    padding: .7rem .75rem;
    text-align: right;
    white-space: nowrap;
    border-bottom: 2px solid var(--deep);
  }
  thead th:first-child {
    text-align: left;
    background: linear-gradient(180deg, var(--bright) 0%, var(--mid) 100%);
    left: 0;
    z-index: 3;
  }

  tbody td {
    padding: .55rem .75rem;
    text-align: right;
    font-size: .9rem;
    border-bottom: 1px solid #eef6fc;
    white-space: nowrap;
    color: var(--ink);
  }
  tbody td:first-child {
    text-align: left;
    font-weight: 600;
    color: var(--mid);
    background: var(--sand);
    position: sticky;
    left: 0;
    z-index: 1;
    border-right: 1px solid var(--pale);
  }
  tbody tr:nth-child(even) td:not(:first-child) {
    background: #fafdff;
  }
  tbody tr:hover td:not(:first-child) {
    background: var(--foam);
  }
  tbody tr:hover td:first-child {
    background: #d9edfb;
  }

  /* Total row */
  tr.total td {
    background: var(--total) !important;
    font-weight: 700;
    color: var(--ink);
    border-top: 2px solid var(--total-border);
    border-bottom: none;
    padding-top: .7rem;
    padding-bottom: .7rem;
  }
  tr.total td:first-child {
    background: #ffe9b3 !important;
    color: #6b4e00;
  }

  .partial {
    color: #b36b00;
    font-weight: 500;
  }
  .dash {
    color: #c4d3df;
  }

  /* ===== Stats strip ===== */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: .75rem;
    margin-bottom: 1.5rem;
  }
  .stat {
    background: linear-gradient(180deg, #ffffff 0%, var(--foam) 100%);
    border: 1px solid var(--pale);
    border-radius: 12px;
    padding: .9rem 1rem;
  }
  .stat .label {
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    font-weight: 600;
  }
  .stat .value {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--mid);
    margin-top: .15rem;
    font-variant-numeric: tabular-nums;
  }
  .stat .unit {
    font-size: .8rem;
    color: var(--muted);
    font-weight: 500;
  }

  /* ===== Chart ===== */
  .chart-card h3 {
    margin: 0 0 .25rem;
    font-size: 1rem;
    color: var(--mid);
  }
  .chart-card p {
    margin: 0 0 .8rem;
    font-size: .85rem;
    color: var(--muted);
  }
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 180px;
    padding: .5rem 0;
    border-bottom: 1.5px solid var(--pale);
  }
  .bar {
    flex: 1;
    background: linear-gradient(180deg, var(--sky) 0%, var(--bright) 100%);
    border-radius: 4px 4px 0 0;
    position: relative;
    min-height: 2px;
    transition: filter .15s;
  }
  .bar:hover { filter: brightness(1.15); }
  .bar span {
    position: absolute;
    bottom: -1.4rem;
    left: 50%;
    transform: translateX(-50%) rotate(-45deg);
    transform-origin: center;
    font-size: .65rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .chart-labels {
    display: flex;
    gap: 4px;
    padding-top: 1.6rem;
  }
  .chart-labels div {
    flex: 1;
    text-align: center;
    font-size: .65rem;
    color: var(--muted);
    transform: rotate(-45deg);
    transform-origin: center;
    white-space: nowrap;
  }

  /* ===== Footer ===== */
  footer {
    text-align: center;
    color: var(--muted);
    font-size: .8rem;
    padding: 1rem;
  }

  /* ===== Warning ===== */
  .warn {
    background: #fff7e6;
    border-left: 4px solid var(--total-border);
    color: #6b4e00;
    padding: .7rem 1rem;
    border-radius: 6px;
    font-size: .88rem;
    margin-top: 1rem;
    display: none;
  }
  .warn.show { display: block; }

  @media (max-width: 640px) {
    header { padding: 1.8rem 1rem 2.5rem; }
    .card { padding: 1rem; border-radius: 10px; }
    thead th, tbody td { padding: .45rem .5rem; font-size: .8rem; }
  }
</style>
</head>

    <div class="bars" id="bars"></div>

</main>

<footer>

  let minWhere = "";
  years.forEach((y) => {
    MONTHS.forEach((m) => {
      const v = DATA[y][m];
      if (v !== undefined && v < minVal) {
        minVal = v;
        minWhere = `${m} ${y}`;
      }
    });
  });

  const completeTotals = years.filter((y) => isComplete(DATA[y])).map((y) => yearSum(DATA[y]));
  const meanTotal = completeTotals.length ? completeTotals.reduce((a, b) => a + b, 0) / completeTotals.length : 0;

  const stats = [
    { label: "Water years", value: years.length, unit: `${firstYear} → ${lastYear}` },
    { label: "Highest month", value: fmt(maxVal), unit: maxWhere },
    { label: "Lowest month", value: fmt(minVal), unit: minWhere },
    { label: "Mean annual", value: fmt(meanTotal), unit: "TMC (complete years)" }
  ];

  statsEl.innerHTML = stats.map((s) => `
    <div class="stat">
      <div class="label">${s.label}</div>
      <div class="value">${s.value} <span class="unit">${s.unit}</span></div>
    </div>
  `).join("");
}

function renderDecade(decade) {
  const years = decades[decade] || [];
  thead.innerHTML = "";
  tbody.innerHTML = "";
  warning.classList.remove("show");

  const headRow = document.createElement("tr");
  const corner = document.createElement("th");
  corner.textContent = "Month";
  headRow.appendChild(corner);

  years.forEach((y) => {
    const th = document.createElement("th");
    th.textContent = y;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);

  MONTHS.forEach((month) => {
    const tr = document.createElement("tr");
    const rh = document.createElement("td");
    rh.textContent = month;
    tr.appendChild(rh);

    years.forEach((y) => {
      const v = DATA[y][month];
      const td = document.createElement("td");

      if (v === undefined) {
        td.textContent = "—";
        td.className = "dash";
      } else {
        td.textContent = fmt(v);
      }

      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  const totalTr = document.createElement("tr");
  totalTr.className = "total";
  const totalHead = document.createElement("td");
  totalHead.textContent = "Annual total";
  totalTr.appendChild(totalHead);

  let anyIncomplete = false;
  years.forEach((y) => {
    const complete = isComplete(DATA[y]);
    const sum = yearSum(DATA[y]);
    const td = document.createElement("td");

    if (complete) {
      td.textContent = fmt(sum);
    } else {
      td.textContent = fmt(sum) + " *";
      td.classList.add("partial");
      anyIncomplete = true;
    }

    totalTr.appendChild(td);
  });

  tbody.appendChild(totalTr);

  if (anyIncomplete) {
    const incompleteYears = years.filter((y) => !isComplete(DATA[y]));
    warning.textContent =
      `⚠️ Incomplete water years (partial totals): ${incompleteYears.join(", ")}. ` +
      "Values marked * are not full-year annual flow.";
    warning.classList.add("show");
  }
}

function renderChart(decade) {
  const years = decades[decade] || [];
  const completeYears = years.filter((y) => isComplete(DATA[y]));
  const chosen = completeYears.length ? completeYears[completeYears.length - 1] : years[years.length - 1];

  const values = MONTHS.map((m) => DATA[chosen][m] || 0);
  const max = Math.max(...values, 1);

  barsEl.innerHTML = "";
  labelsEl.innerHTML = "";

  MONTHS.forEach((m, i) => {
    const v = values[i];
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.height = `${(v / max) * 100}%`;
    bar.title = `${m} ${chosen}: ${fmt(v)} TMC`;
    barsEl.appendChild(bar);

    const lbl = document.createElement("div");
    lbl.textContent = m.replace(/\./g, "");
    labelsEl.appendChild(lbl);
  });
}

function populateSelect() {
  decadeSel.innerHTML = decadeLabels.map((d) => `<option value="${d}">${d}</option>`).join("");
  const latest = decadeLabels[decadeLabels.length - 1];
  decadeSel.value = latest;
}

function init() {
  populateSelect();

  const coverageBadge = document.getElementById("coverageBadge");
  const allYears = Object.keys(DATA).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  if (coverageBadge) {
    coverageBadge.textContent = `${allYears[0]} → ${allYears[allYears.length - 1]}`;
  }

  renderStats();

  const applySelection = () => {
    const selected = decadeSel.value;
    renderDecade(selected);
    renderChart(selected);
  };

  decadeSel.addEventListener("change", applySelection);
  applySelection();
}

init();
</script>

</body>
</html>
